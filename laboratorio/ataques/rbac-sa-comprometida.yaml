# Escenario de ataque: cuenta de servicio con permisos excesivos.
# Representa una credencial comprometida (p. ej. el token de un pipeline
# o de una herramienta interna) que tiene permiso de BORRAR deployments,
# algo que su funcion no requiere (violacion de minimo privilegio).
# El experimento la usa via impersonacion para borrar 'cartservice'.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-comprometida
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: permisos-excesivos
  namespace: default
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: permisos-excesivos-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: sa-comprometida
    namespace: default
roleRef:
  kind: Role
  name: permisos-excesivos
  apiGroup: rbac.authorization.k8s.io
